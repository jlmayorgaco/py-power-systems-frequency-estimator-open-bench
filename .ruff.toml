# Ruff configuration (https://docs.astral.sh/ruff/)
# Place this file at the repo root as `.ruff.toml`

line-length = 100
target-version = "py310"
src = ["ofb", "tests"]

# Don't lint generated artifacts or virtualenvs
exclude = [
  "results/",
  ".venv/",
  ".env/",
  "__pycache__/",
  ".git/",
  ".mypy_cache/",
  ".pytest_cache/",
  ".ruff_cache/",
]

[lint]
# Rule sets: pyflakes/pycodestyle (E,F), isort (I), pyupgrade (UP),
# bugbear (B), flake8-simplify (SIM), flake8-pyi (PIE), tidy imports (TID),
# commas (COM), quotes (Q), Ruff-specific (RUF)
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "TID", "COM", "Q", "RUF"]

# Common ignores:
# - E203: whitespace before ':' (Black-compatible)
# - E266: too many leading '#' for block comment
# - E501: line length handled by formatter/line-length
# - B905: zip() without strict= (we opt-in later if needed)
ignore = ["E203", "E266", "E501", "B905"]

# File-specific relaxations
per-file-ignores = {
  "ofb/__init__.py" = ["F401"],
  "tests/**" = ["B011", "UP015"],
}

[mccabe]
max-complexity = 12

[lint.isort]
known-first-party = ["ofb"]
combine-as-imports = true
force-sort-within-sections = true
lines-between-types = 1

[lint.pyupgrade]
keep-runtime-typing = true

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 100