[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openfreqbench"
version = "0.1.0"
description = "Computationally-aware benchmarking for grid frequency estimators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [{ name = "Jorge Luis Mayorga Taborda" }]

keywords = ["power systems", "frequency estimation", "benchmark", "PMU", "OpenDSS"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.4",
  "typer>=0.12",
  "simpy>=4.0",
  "matplotlib>=3.8",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "rich>=13",
]

[project.optional-dependencies]
opendss = ["dss-python>=0.14.0"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.8",
  "pip-tools>=7.0",
  "types-PyYAML",
  "types-psutil",
]

# ---- Console scripts (updated entrypoint) ----
[project.scripts]
ofb = "ofb.cli.app:main"
ofb-new = "ofb.cli.scaffold:main"
ofb-docs = "ofb.cli.docs:main"

# -------------------------
# setuptools packaging
# -------------------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"ofb.scenarios" = ["catalog.yaml"]
"ofb.benchmarks.configs" = ["*.yaml"]

# use automatic package discovery
[tool.setuptools.packages.find]
include = ["ofb*"]

# -------------------------
# Tooling
# -------------------------
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
